{% extends "base.html" %}
{% import "_includes/macros.html" as m with context %}

{% block title %}{{ page.title | display_title }} | {{ super() }}{% endblock %}

{% block content %}
<section class="block">
  <div class="wrap">
    {{ m.page_header(page.title | display_title, icon='newspaper') }}
  </div>
</section>
<section class="block">
  <div class="wrap">
    {{ m.news_list(news, ruled=true) }}
  </div>
</section>
{% endblock %}
