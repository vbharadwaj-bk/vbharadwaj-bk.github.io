{% macro figure(path, class=none, width=none, height=none, min_width=none, min_height=none, max_width=none, max_height=none, alt=none, title=none, zoomable=none, caption=none, style=none, cache_bust=true) -%}
<figure class="{{ class or 'figure' }}">
  <img src="{{ (path | bust_file_cache if cache_bust else path) | relative_url }}"
    {%- if width %} width="{{ width }}"{% endif %}
    {%- if height %} height="{{ height }}"{% endif %}
    {%- if alt %} alt="{{ alt | trim | e }}"{% endif %}
    {%- if title %} title="{{ title | trim | e }}"{% endif %}
    {%- if style %} style="{{ style }}"{% endif %}
    {%- if zoomable %} data-zoomable{% endif %} loading="lazy">
  {%- if caption %}
  <figcaption>{{ caption | trim }}</figcaption>
  {%- endif %}
</figure>
{%- endmacro %}
